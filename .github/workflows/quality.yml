name: Quality

on:
    pull_request:
    push:
        branches:
            - develop
            - main

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    VITE_MEDIA_BASE_URL: https://pub-35a1591bfd784e15bae49fe6349d16d0.r2.dev

jobs:
    code:
        name: Code quality and production build
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run quality gate
              run: npm run check

            - name: Audit generated media metadata
              if: ${{ hashFiles('public/media/**/*') != '' }}
              run: npm run media:check

            - name: Verify public media samples
              run: npm run media:remote

            - name: Share the verified build with browser jobs
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: browser-build
                  path: dist/
                  include-hidden-files: true
                  retention-days: 1
                  if-no-files-found: error

    browsers:
        name: Browser flows (${{ matrix.shard }}/4)
        needs: code
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        container:
            # Keep the preinstalled browsers aligned with @playwright/test.
            image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
            options: --ipc=host
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Trust the checked-out workspace in the container
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Download the verified build
              uses: actions/download-artifact@v8.0.2
              with:
                  name: browser-build
                  path: dist/

            - name: Verify browser flows with one worker
              run: npm run test:e2e -- --workers=1 --shard=${{ matrix.shard }}/4

            - name: Preserve failed browser traces
              if: failure()
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: browser-failure-traces-${{ matrix.shard }}
                  path: test-results/
                  retention-days: 7
                  if-no-files-found: ignore

    quality:
        name: Lint, tests, build and security
        if: ${{ always() }}
        needs: [code, browsers]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Require every quality and browser job to succeed
              env:
                  CODE_RESULT: ${{ needs.code.result }}
                  BROWSER_RESULT: ${{ needs.browsers.result }}
              run: test "$CODE_RESULT" = success && test "$BROWSER_RESULT" = success
