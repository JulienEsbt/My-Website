version: 2
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: develop
      schedule:
          interval: monthly
      open-pull-requests-limit: 2
      groups:
          routine-updates:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major

    - package-ecosystem: github-actions
      directory: /
      target-branch: develop
      schedule:
          interval: monthly
      open-pull-requests-limit: 1
      groups:
          routine-actions:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
