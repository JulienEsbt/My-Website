name: Quality

on:
    pull_request:
    push:
        branches:
            - develop
            - main

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Lint, tests, build and security
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run quality gate
              run: npm run check

            - name: Audit generated media metadata
              if: ${{ hashFiles('public/media/**/*') != '' }}
              run: npm run media:check
