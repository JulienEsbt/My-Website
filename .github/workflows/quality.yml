name: Quality

on:
    pull_request:
    push:
        branches:
            - develop
            - main

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Lint, tests, build and security
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            VITE_MEDIA_BASE_URL: https://pub-35a1591bfd784e15bae49fe6349d16d0.r2.dev

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run quality gate
              run: npm run check

            - name: Audit generated media metadata
              if: ${{ hashFiles('public/media/**/*') != '' }}
              run: npm run media:check

            - name: Install browsers for integration tests
              # The Azure apt mirror stalled for 19 minutes in run 40379362732.
              # Use Ubuntu's archive while keeping package signature verification.
              run: |
                  sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
                  npx playwright install --with-deps chromium webkit

            - name: Verify browser flows
              run: npm run test:e2e

            - name: Preserve failed browser traces
              if: failure()
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: browser-failure-traces
                  path: test-results/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Verify public media samples
              run: npm run media:remote
